apiVersion: 1

# Yeni UID mevcut elle kurulmus datasource'u degistirmez.
datasources:
  - name: Bank-Demo Prometheus
    uid: bank-demo-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 15s
      manageAlerts: true
