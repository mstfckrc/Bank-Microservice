server:
  port: 8086

spring:
  application:
    name: auth-service

  security:
    oauth2:
      client:
        registration:
          bank-service:
            provider: bank-keycloak
            client-id: ${BANK_SERVICE_CLIENT_ID:bank-auth-service}
            client-secret: ${BANK_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - bank.customer.accounts.close
              - bank.company.write
              - bank.company.read
              - bank.company.delete
        provider:
          bank-keycloak:
            token-uri: ${BANK_SERVICE_TOKEN_URI}
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}
          jwk-set-uri: ${OAUTH_JWK_SET_URI}

  datasource:
    # 🚀 SADECE DEĞİŞKEN ADLARI:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    # 🚀 SADECE DEĞİŞKEN ADLARI:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

eureka:
  client:
    service-url:
      # 🚀 SADECE DEĞİŞKEN ADI:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

keycloak:
  # 🚀 İÇ AĞ ROTASI DEĞİŞKENE BAĞLANDI:
  auth-server-url: ${KEYCLOAK_INTERNAL_URL}
  realm: bank-realm
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:bank-auth-admin}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

app:
  security:
    audience: ${OAUTH_AUDIENCE:bank-api}

recaptcha:
  secret: ${RECAPTCHA_SECRET}

# ==========================================
# 🔭 YENİ EKLENDİ: ACTUATOR (İSTİHBARAT) AYARLARI
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
