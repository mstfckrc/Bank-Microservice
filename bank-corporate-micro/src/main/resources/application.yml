server:
  port: 8085 # Kurumsal servisimiz bu portta çalışacak

spring:
  application:
    name: bank-corporate-micro

  security:
    oauth2:
      client:
        registration:
          bank-service:
            provider: bank-keycloak
            client-id: ${BANK_SERVICE_CLIENT_ID:bank-corporate-service}
            client-secret: ${BANK_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - bank.customer.profile.read
              - bank.account.validate
              - bank.salary.pay
              - bank.access.read
        provider:
          bank-keycloak:
            token-uri: ${BANK_SERVICE_TOKEN_URI}
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}
          jwk-set-uri: ${OAUTH_JWK_SET_URI}

  datasource:
    # 🚀 SADECE DEĞİŞKEN ADLARI:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  rabbitmq:
    # 🚀 SADECE DEĞİŞKEN ADLARI:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

eureka:
  client:
    service-url:
      # 🚀 SADECE DEĞİŞKEN ADI:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

# ==========================================
# 🔭 YENİ EKLENDİ: ACTUATOR (İSTİHBARAT) AYARLARI
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

app:
  security:
    audience: ${OAUTH_AUDIENCE:bank-api}
