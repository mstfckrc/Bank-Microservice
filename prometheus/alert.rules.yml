groups:
  - name: KarargahAlarmlari
    rules:
      - alert: KonteynerCoktu
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kritik Hata: Konteyner kapandı!"
          description: "Karargahtaki '{{ $labels.instance }}' isimli servis 1 dakikadır çevrimdışı."

      - alert: YuksekCpuKullanimi
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uyarı: Yüksek CPU Kullanımı!"
          description: "Ubuntu VM işlemci yükü 5 dakikadır %90'ın üzerinde (Şu an: {{ $value }}%)."

      - alert: KritikRamSeviyesi
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 95
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Kritik Hata: RAM Tükeniyor!"
          description: "Ubuntu VM bellek doluluğu 3 dakikadır %95'in üzerinde (Şu an: {{ $value }}%)."

      - alert: KokDiskAlaniAzaliyor
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="node_exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node_exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uyarı: Kök disk alanı azalıyor."
          description: "{{ $labels.instance }} kök dosya sisteminin kullanımı 5 dakikadır %85'in üzerinde (Şu an: {{ $value }}%)."

      - alert: KritikKokDiskAlani
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="node_exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node_exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kritik: Kök disk alanı tükeniyor."
          description: "{{ $labels.instance }} kök dosya sisteminin kullanımı 2 dakikadır %95'in üzerinde (Şu an: {{ $value }}%)."
